<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ash Cloud</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/assets/player.js" defer></script>
  <script src="/assets/app.js" defer></script>
</head>
<body>
  <main>
    <h1>Ash Cloud</h1>
    <p class="note">Test page (Phase 1). The real app arrives in step 6.</p>

    <p id="status" role="status">Checking…</p>

    <form id="login" hidden>
      <label>Username
        <input name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label>Password
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Log in</button>
    </form>

    <section id="files" hidden aria-label="Your files">
      <nav id="crumbs" aria-label="Folder"></nav>
      <ul id="entries"></ul>
      <p id="empty" class="note" hidden></p>
    </section>

    <section id="player" hidden aria-label="Video player">
      <div id="stage">
        <video id="video" playsinline preload="metadata"></video>
        <p id="buffering" hidden>Loading…</p>
        <div id="controls">
          <div class="seek-row">
            <input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position in the video">
            <span id="clock">0:00 / 0:00</span>
          </div>
          <div class="control-row">
            <button id="back10" type="button" aria-label="Back 10 seconds">−10</button>
            <button id="playpause" type="button" aria-label="Play">▶</button>
            <button id="fwd10" type="button" aria-label="Forward 10 seconds">+10</button>
            <span class="spacer"></span>
            <button id="audio-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="audio-menu">Audio</button>
            <button id="fullscreen" type="button" aria-label="Full screen">⤢</button>
          </div>
          <div id="audio-menu" role="menu" aria-label="Audio track" hidden></div>
        </div>
      </div>
      <p id="player-title"></p>
      <p id="audio-status" class="note" role="status"></p>
      <p class="player-links"><a id="player-back" href="#/">← Back to the folder</a> <a id="player-download" href="#">Download</a></p>
    </section>

    <section id="account" hidden>
      <p>Logged in as <strong id="who"></strong> (<span id="role"></span>).</p>
      <p class="note">This device stays logged in until <span id="expires"></span>, and longer if you keep using it.</p>
      <button id="logout" type="button">Log out</button>
    </section>

    <p id="error" class="error" role="alert"></p>
  </main>
</body>
</html>
